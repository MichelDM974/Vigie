name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt -c constraints.txt

      - name: Lancer les tests
        run: pytest tests/ -v

      - name: Vérifier la syntaxe de l'extension GNOME
        run: node --check "gnome-extension/vigie@micheldm974.github.io/extension.js"
